<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CipherBox 管理控制台</title>
<!--
  单文件管理控制台（无外部依赖，内网可用）。
  页面本身不含任何数据，可以匿名加载；所有数据请求都带
  Authorization: Bearer <admin令牌>，令牌只存 sessionStorage（关标签页即清除）。
  数据端点：GET /admin/summary · GET /events · POST /admin/rotate
            · POST /admin/revoke · POST /admin/verify_chain · GET /health
-->
<style>
:root{
  --bg:#11151c; --panel:#1a2028; --panel2:#222a35; --line:#2e3947;
  --fg:#dce3ec; --dim:#8a97a8; --acc:#4f9cf9; --ok:#3fb96f; --bad:#e5484d;
  --warn:#e2a336; --mono:Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
a{color:var(--acc)}
.wrap{max-width:1200px;margin:0 auto;padding:16px 20px 48px}
header{display:flex;align-items:center;gap:14px;padding:10px 0 18px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:600}
header .sub{color:var(--dim);font-size:12px}
.spacer{flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:#666;display:inline-block;vertical-align:middle}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:6px 14px;cursor:pointer;font:inherit}
button:hover{border-color:var(--acc);color:#fff}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
button.danger:hover{background:var(--bad);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{background:#0e131a;color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:6px 10px;font:inherit}
input:focus,select:focus{outline:none;border-color:var(--acc)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:16px;margin-bottom:16px}
.panel h2{font-size:14px;margin:0 0 12px;color:var(--dim);font-weight:600;
  text-transform:uppercase;letter-spacing:.5px}
.banner{border-radius:8px;padding:9px 14px;margin-bottom:14px;display:none;
  border:1px solid;font-size:13px;word-break:break-all}
.banner.ok{display:block;background:#12271c;border-color:var(--ok);color:#9fdcb8}
.banner.bad{display:block;background:#2b1517;border-color:var(--bad);color:#f2b3b5}
.banner.info{display:block;background:#182234;border-color:var(--acc);color:#a9c9f5}
/* login */
#login{max-width:420px;margin:12vh auto 0;text-align:center}
#login .panel{text-align:left}
#login h1{font-size:20px;margin:4px 0 2px}
#login p{color:var(--dim);font-size:13px;margin:0 0 14px}
#login input{width:100%;margin:8px 0 14px;font-family:var(--mono);font-size:13px}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card .v{font-size:24px;font-weight:600;font-family:var(--mono)}
.card .k{color:var(--dim);font-size:12px;margin-top:2px}
.card .v.ok{color:var(--ok)} .card .v.warn{color:var(--warn)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--dim);text-align:left;font-weight:600;padding:7px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #232b36;vertical-align:top}
tr:last-child td{border-bottom:none}
td.mono,th.mono{font-family:var(--mono);font-size:12px}
tr.failed td{background:#2b1517}
.badge{display:inline-block;border-radius:10px;padding:1px 9px;font-size:11px;
  border:1px solid var(--line);color:var(--dim)}
.badge.enc{border-color:var(--ok);color:#9fdcb8}
.badge.dec{border-color:var(--acc);color:#a9c9f5}
.badge.block{border-color:var(--bad);color:#f2b3b5}
.badge.cur{border-color:var(--warn);color:var(--warn)}
.badge.gone{color:#6b7684;text-decoration:line-through}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{width:150px}
.toolbar label{color:var(--dim);font-size:12px}
.pager{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--dim);font-size:12px}
.muted{color:var(--dim);font-size:12px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#chainResult{font-size:12px;font-family:var(--mono);color:var(--dim);margin-left:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login" class="wrap">
  <h1>CipherBox 管理控制台</h1>
  <p>请输入 admin 令牌（seed 时生成，仅明文一次）</p>
  <div class="panel">
    <label for="tok">admin 令牌</label>
    <input id="tok" type="password" placeholder="paste admin token…" autocomplete="off">
    <button class="primary" id="loginBtn" style="width:100%">进入控制台</button>
    <p class="muted" style="margin:12px 0 0">令牌仅保存在本标签页 sessionStorage，关闭即清除。</p>
  </div>
</div>

<div id="app" class="wrap" style="display:none">
  <header>
    <h1>CipherBox 管理控制台</h1>
    <span class="sub">HTTPS-only · 127.0.0.1:8443</span>
    <span class="dot" id="healthDot" title="服务器健康状态"></span>
    <span class="spacer"></span>
    <button id="verifyBtn">校验审计链</button>
    <span id="chainResult"></span>
    <button id="logoutBtn">退出</button>
  </header>

  <div id="banner" class="banner"></div>

  <div class="cards" id="cards"></div>

  <div class="panel" style="margin-top:16px">
    <h2>审计事件</h2>
    <div class="toolbar">
      <label>员工</label><input id="fEmp" placeholder="employee">
      <label>动作</label><input id="fAct" placeholder="encrypt / decrypt / …" style="width:180px">
      <label>密钥版本</label><input id="fKv" type="number" min="1" style="width:80px">
      <select id="fLimit">
        <option value="50">50 条/页</option>
        <option value="100" selected>100 条/页</option>
        <option value="200">200 条/页</option>
      </select>
      <button class="primary" id="evRefresh">查询</button>
      <span class="spacer" style="flex:1"></span>
      <span class="muted" id="evMeta"></span>
    </div>
    <table>
      <thead><tr>
        <th>#</th><th>时间</th><th>员工</th><th>动作</th><th>密钥版</th>
        <th>机器</th><th>结果</th><th>文件哈希(明文)</th>
      </tr></thead>
      <tbody id="evBody"></tbody>
    </table>
    <div class="pager">
      <button id="evPrev">‹ 上一页</button>
      <button id="evNext">下一页 ›</button>
      <span id="evPage"></span>
    </div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>密钥版本</h2>
      <div class="actions" style="margin-bottom:10px">
        <button class="danger" id="rotateBtn">轮换主密钥（追加新版本）</button>
        <span class="muted">旧版本保留用于解密旧文件</span>
      </div>
      <table>
        <thead><tr><th>版本</th><th>创建时间</th></tr></thead>
        <tbody id="keyBody"></tbody>
      </table>
    </div>

    <div class="panel">
      <h2>员工令牌</h2>
      <div class="actions" style="margin-bottom:10px">
        <input id="rvEmp" placeholder="要吊销的员工名" style="width:170px">
        <button class="danger" id="revokeBtn">吊销该员工全部令牌</button>
      </div>
      <table>
        <thead><tr>
          <th>员工</th><th>级别</th><th>在用</th><th>已吊销</th><th>最晚到期</th>
        </tr></thead>
        <tbody id="empBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const TOK_KEY = "cb_admin_token";
let evOffset = 0;

/* ---------- helpers ---------- */
function banner(kind, msg){
  const b = $("#banner");
  b.className = "banner " + kind;
  b.textContent = msg;
}
function clearBanner(){ $("#banner").className = "banner"; }

async function api(path, opts = {}){
  const headers = Object.assign({}, opts.headers || {});
  const tok = sessionStorage.getItem(TOK_KEY);
  if (tok) headers["Authorization"] = "Bearer " + tok;
  if (opts.json !== undefined){
    headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.json);
  }
  let resp;
  try {
    resp = await fetch(path, Object.assign({}, opts, {headers}));
  } catch (e){
    throw new Error("服务器不可达（未启动或网络异常）");
  }
  if (resp.status === 401){
    logout();
    throw new Error("令牌无效或已过期，请重新登录");
  }
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok){
    throw new Error(data.detail ? (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail)) : ("HTTP " + resp.status));
  }
  return data;
}

function fmtTs(iso){
  if (!iso) return "—";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString("zh-CN", {hour12:false});
}
function shortHash(h){ return h ? h.slice(0, 12) + "…" : "—"; }

function td(row, text, cls, title){
  const c = document.createElement("td");
  if (cls) c.className = cls;
  if (title) c.title = title;
  c.textContent = text;
  row.appendChild(c);
  return c;
}

/* ---------- auth ---------- */
function logout(){
  sessionStorage.removeItem(TOK_KEY);
  $("#app").style.display = "none";
  $("#login").style.display = "block";
}
async function login(){
  const tok = $("#tok").value.trim();
  if (!tok){ banner("bad", "请输入令牌"); return; }
  sessionStorage.setItem(TOK_KEY, tok);
  try {
    await api("/admin/summary");          // 用真实端点验证令牌
    $("#tok").value = "";
    clearBanner();
    $("#login").style.display = "none";
    $("#app").style.display = "block";
    await refreshAll();
    startHealth();
  } catch (e){
    banner("bad", e.message);
  }
}
$("#loginBtn").addEventListener("click", login);
$("#tok").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
$("#logoutBtn").addEventListener("click", logout);

/* ---------- overview ---------- */
function renderSummary(s){
  const activeEmp = s.employees.filter(e => e.active_tokens > 0).length;
  const cards = [
    {v: s.current === null ? "—" : "v" + s.current, k: "当前主密钥版本", cls:"ok"},
    {v: s.keys.length,        k: "密钥版本总数"},
    {v: s.event_count,        k: "审计事件总数"},
    {v: activeEmp + " / " + s.employees.length, k: "在用 / 全部员工"},
  ];
  const box = $("#cards");
  box.textContent = "";
  for (const c of cards){
    const d = document.createElement("div");
    d.className = "card";
    const v = document.createElement("div");
    v.className = "v" + (c.cls ? " " + c.cls : "");
    v.textContent = c.v;
    const k = document.createElement("div");
    k.className = "k";
    k.textContent = c.k;
    d.append(v, k);
    box.appendChild(d);
  }

  const kb = $("#keyBody");
  kb.textContent = "";
  for (const k of s.keys){
    const tr = document.createElement("tr");
    const vc = td(tr, "v" + k.version, "mono");
    if (k.version === s.current){
      const b = document.createElement("span");
      b.className = "badge cur";
      b.textContent = "当前";
      vc.appendChild(document.createTextNode(" "));
      vc.appendChild(b);
    }
    td(tr, fmtTs(k.created_at), "mono");
    kb.appendChild(tr);
  }
  if (!s.keys.length){
    const tr = document.createElement("tr");
    td(tr, "（尚无密钥版本，点上方按钮轮换生成 v1）", "muted");
    tr.lastChild.colSpan = 2;
    kb.appendChild(tr);
  }

  const eb = $("#empBody");
  eb.textContent = "";
  for (const e of s.employees){
    const tr = document.createElement("tr");
    const nc = td(tr, e.employee);
    if (e.active_tokens === 0) nc.classList.add("badge", "gone");
    td(tr, e.level === "admin" ? "admin" : "employee");
    td(tr, String(e.active_tokens) + " / " + e.tokens);
    td(tr, String(e.revoked_tokens));
    td(tr, fmtTs(e.latest_expiry), "mono");
    eb.appendChild(tr);
  }
}

async function refreshAll(){
  try {
    renderSummary(await api("/admin/summary"));
    await loadEvents();
    clearBanner();
  } catch (e){
    banner("bad", e.message);
  }
}

/* ---------- events ---------- */
async function loadEvents(){
  const p = new URLSearchParams();
  const emp = $("#fEmp").value.trim();
  const act = $("#fAct").value.trim();
  const kv  = $("#fKv").value.trim();
  const lim = parseInt($("#fLimit").value, 10);
  if (emp) p.set("employee", emp);
  if (act) p.set("action", act);
  if (kv)  p.set("key_version", kv);
  p.set("limit", String(lim));
  p.set("offset", String(evOffset));

  const data = await api("/events?" + p.toString());
  const body = $("#evBody");
  body.textContent = "";

  const ACTION_CLS = {"encrypt":"enc", "decrypt":"dec"};
  for (const e of data.events){
    const tr = document.createElement("tr");
    if (!e.ok) tr.className = "failed";
    td(tr, String(e.id), "mono");
    td(tr, fmtTs(e.ts), "mono", e.ts);
    td(tr, e.employee);
    const ac = td(tr);
    const b = document.createElement("span");
    b.className = "badge " + (ACTION_CLS[e.action] || (e.ok ? "" : "block"));
    b.textContent = e.action || "(空)";
    ac.appendChild(b);
    td(tr, e.key_version === null ? "—" : "v" + e.key_version, "mono");
    td(tr, e.machine || "—");
    td(tr, e.ok ? "ok" : "FAIL", "", e.ok ? "" : "操作失败标志 ok=0");
    if (!e.ok) tr.lastChild.style.color = "var(--bad)";
    td(tr, shortHash(e.file_hash), "mono", e.file_hash);
    body.appendChild(tr);
  }
  if (!data.events.length){
    const tr = document.createElement("tr");
    td(tr, "（无事件）", "muted");
    tr.lastChild.colSpan = 8;
    body.appendChild(tr);
  }
  $("#evMeta").textContent = "本页 " + data.count + " 条";
  $("#evPage").textContent = "offset " + evOffset;
  $("#evPrev").disabled = evOffset <= 0;
  $("#evNext").disabled = data.count < lim;
}

$("#evRefresh").addEventListener("click", () => { evOffset = 0; loadEvents().catch(e => banner("bad", e.message)); });
$("#evPrev").addEventListener("click", () => { evOffset = Math.max(0, evOffset - parseInt($("#fLimit").value, 10)); loadEvents().catch(e => banner("bad", e.message)); });
$("#evNext").addEventListener("click", () => { evOffset += parseInt($("#fLimit").value, 10); loadEvents().catch(e => banner("bad", e.message)); });
for (const id of ["fEmp", "fAct", "fKv"]){
  $("#" + id).addEventListener("keydown", e => { if (e.key === "Enter") $("#evRefresh").click(); });
}

/* ---------- actions ---------- */
let rotateArmed = null;
$("#rotateBtn").addEventListener("click", async () => {
  const btn = $("#rotateBtn");
  if (rotateArmed === null){
    rotateArmed = setTimeout(() => { rotateArmed = null; btn.textContent = "轮换主密钥（追加新版本）"; }, 5000);
    btn.textContent = "再点一次确认轮换";
    banner("info", "轮换会追加新密钥版本（不可撤销，旧版本保留）；5 秒内再次点击确认。");
    return;
  }
  clearTimeout(rotateArmed); rotateArmed = null;
  btn.textContent = "轮换主密钥（追加新版本）";
  try {
    const r = await api("/admin/rotate", {method: "POST"});
    banner("ok", "已生成密钥版本 v" + r.version + "，客户端下次取钥自动同步。");
    await refreshAll();
  } catch (e){ banner("bad", e.message); }
});

$("#revokeBtn").addEventListener("click", async () => {
  const emp = $("#rvEmp").value.trim();
  if (!emp){ banner("bad", "请输入要吊销的员工名"); return; }
  if (!confirm('确认吊销员工 "' + emp + '" 的全部令牌？其客户端将立即 401。')) return;
  try {
    const r = await api("/admin/revoke", {method: "POST", json: {employee: emp}});
    $("#rvEmp").value = "";
    banner("ok", "已吊销 " + r.revoked + " 个令牌（员工 " + emp + "）。");
    await refreshAll();
  } catch (e){ banner("bad", e.message); }
});

$("#verifyBtn").addEventListener("click", async () => {
  const out = $("#chainResult");
  out.textContent = "校验中…";
  try {
    const r = await api("/admin/verify_chain", {method: "POST"});
    if (r.ok){
      out.textContent = "✔ 通过（" + r.count + " 条事件）";
      out.style.color = "var(--ok)";
    } else {
      out.textContent = "✘ 失败：" + r.error;
      out.style.color = "var(--bad)";
    }
  } catch (e){
    out.textContent = "✘ " + e.message;
    out.style.color = "var(--bad)";
  }
});

/* ---------- health ---------- */
let healthTimer = null;
async function pingHealth(){
  try {
    const r = await fetch("/health");
    $("#healthDot").className = "dot " + (r.ok ? "ok" : "bad");
    $("#healthDot").title = r.ok ? "服务器正常" : "服务器异常 HTTP " + r.status;
  } catch (e){
    $("#healthDot").className = "dot bad";
    $("#healthDot").title = "服务器不可达";
  }
}
function startHealth(){
  pingHealth();
  if (healthTimer) clearInterval(healthTimer);
  healthTimer = setInterval(pingHealth, 30000);
}

/* ---------- boot ---------- */
if (sessionStorage.getItem(TOK_KEY)){
  login();   // 标签页未关时刷新页面自动恢复
}
</script>
</body>
</html>
